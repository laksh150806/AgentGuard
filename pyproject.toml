[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard-research"
version = "0.4.0"
description = "Local-first tool authorization research for support agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentguard = "agentguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
